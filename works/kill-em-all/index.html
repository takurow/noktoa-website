<style>
:root{--ink:#07090a;--mute:#8fa3a6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:#eef3f4;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
p,dd{word-break:keep-all;line-break:strict;overflow-wrap:anywhere;text-wrap:pretty}
.hd{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,72px);z-index:5;mix-blend-mode:difference}
.hd img{height:20px}.hd a.back{color:#fff;text-decoration:none;font:500 11px "Inter Tight";letter-spacing:.22em}
.hero{position:relative;height:100svh;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,10,0) 45%,var(--ink))}

.hero h1 small{display:block;margin-top:18px;font:800 12px "Inter Tight";letter-spacing:.3em;color:var(--mute)}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(72px,12vh,140px) clamp(20px,5vw,72px)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,96px);align-items:start}
.two img{width:100%;display:block}
.lead{font:500 clamp(22px,2.6vw,32px)/1.7 "Shippori Mincho";letter-spacing:.06em;margin-bottom:36px}
.body{font-size:15px;line-height:2.1;color:#cfdadb;letter-spacing:.04em}
dl{margin-top:56px;display:grid;grid-template-columns:auto 1fr;gap:14px 32px;font-size:13px;border-top:1px solid #1d2426;padding-top:28px}
dt{font:800 11px/2 "Inter Tight";letter-spacing:.22em;color:var(--mute)}
dd{line-height:2}
.tbd{color:#6d7e81}
.foot{text-align:center;padding:0 20px 96px}
.foot a{color:#eef3f4;font:800 12px "Inter Tight";letter-spacing:.24em;text-decoration:none;border-bottom:1px solid}
@media (max-width:760px){.two{grid-template-columns:1fr}}
